deployment:
  tasks:
    - export DEPLOYPATH=/home/a2bremov/davidswinstead.com/links/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/rsync -av --delete --exclude '.git' --exclude '.cpanel.yml' ./ $DEPLOYPATH
    - /usr/bin/find $DEPLOYPATH -type d -exec /bin/chmod 755 {} +
    - /usr/bin/find $DEPLOYPATH -type f -exec /bin/chmod 644 {} +
